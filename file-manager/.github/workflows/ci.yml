name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore file-manager.slnx
      - run: dotnet build file-manager.slnx -c Release --no-restore
      - run: dotnet test file-manager.slnx -c Release --no-build --logger trx
